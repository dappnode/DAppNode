# Builds the unattended Ubuntu ISO and installs it from UEFI USB media in QEMU.
# It completes the required reboots and verifies the installed DAppNode system.
#
# Runs on our archive-1 org runners. Pull requests from forks use
# ubuntu-latest instead, so outside code never runs on our machines.
# The runner needs /dev/kvm, Docker, apt and passwordless sudo.
name: Ubuntu unattended USB ISO end-to-end

on:
  workflow_dispatch:
  pull_request:
  # Weekly run against master to catch breakage from upstream package changes.
  schedule:
    - cron: "0 7 * * 1"
      timezone: "Europe/Madrid"

permissions:
  contents: read

concurrency:
  group: ubuntu-iso-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    name: Install Ubuntu unattended ISO via UEFI USB
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || 'archive-1' }}
    timeout-minutes: 90
    env:
      # Own Compose project, so a parallel ISO job on the same Docker host cannot
      # reuse or remove this job's installer container.
      COMPOSE_PROJECT_NAME: dappnode-iso-e2e-ubuntu
      # Distinct from the Debian job, so both can run on the same host at once.
      E2E_TAP_IFACE: dne2e1
      E2E_HOST_IP: 192.168.78.1
      E2E_GUEST_IP: 192.168.78.10
      E2E_GUEST_MAC: "52:54:00:d4:00:11"

    steps:
      # A cancelled run on a self-hosted runner can leave root-owned build output
      # that would stop checkout from cleaning the workspace.
      - name: Reclaim the workspace
        if: runner.environment == 'self-hosted'
        run: sudo chown -R "$(id -u):$(id -g)" "${GITHUB_WORKSPACE}"

      - name: Checkout
        uses: actions/checkout@v6

      - name: Build Ubuntu unattended ISO
        run: |
          export BASE_OS=ubuntu
          export UNATTENDED=true
          # Retry so a transient mirror outage does not fail the whole E2E run.
          for attempt in 1 2 3; do
            docker compose up --build --abort-on-container-exit --exit-code-from dappnode_installer && break
            [ "${attempt}" -lt 3 ] || exit 1
            echo "::warning::ISO build attempt ${attempt} failed; retrying in 30s"
            sleep 30
          done
          ls -lrt images/Dappnode-ubuntu-*.iso

      - name: Install QEMU test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils ovmf socat sshpass dnsmasq-base
          if [ -e /dev/kvm ] && ! { [ -r /dev/kvm ] && [ -w /dev/kvm ]; }; then
            sudo chmod a+rw /dev/kvm
          fi
          [ -e /dev/kvm ] || echo "::warning::/dev/kvm is missing; the install falls back to slow TCG emulation"

      - name: Create the guest network
        run: |
          mkdir -p test-output/ubuntu-e2e
          state_dir="${PWD}/test-output/ubuntu-e2e/network"
          # Clear anything a cancelled run left behind on a reused host.
          sudo E2E_TAP_IFACE="${E2E_TAP_IFACE}" E2E_HOST_IP="${E2E_HOST_IP}" \
            E2E_NETWORK_STATE_DIR="${state_dir}" bash test/e2e_network.sh down
          sudo E2E_TAP_IFACE="${E2E_TAP_IFACE}" E2E_HOST_IP="${E2E_HOST_IP}" \
            E2E_GUEST_IP="${E2E_GUEST_IP}" E2E_GUEST_MAC="${E2E_GUEST_MAC}" \
            E2E_NETWORK_STATE_DIR="${state_dir}" bash test/e2e_network.sh up

      - name: Complete Ubuntu unattended UEFI USB installation
        env:
          E2E_BOOT_MODE: usb
          E2E_FIRMWARE: uefi
        run: |
          ubuntu_iso=$(find images -maxdepth 1 -type f -name 'Dappnode-ubuntu-*-live-server-amd64.iso' -print -quit)
          test -n "${ubuntu_iso}"
          bash test/e2e_ubuntu_iso.sh "${ubuntu_iso}"

      - name: Make network logs readable
        if: always()
        run: sudo chmod -R a+rX test-output || true

      - name: Upload installation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-unattended-usb-installation-logs
          path: test-output/ubuntu-e2e/
          if-no-files-found: ignore
          retention-days: 7

      # Ephemeral GitHub-hosted runners are discarded; a self-hosted host is not.
      - name: Remove the guest network and build output
        if: always() && runner.environment == 'self-hosted'
        run: |
          # Only this project's installer container, network and image; the image is
          # rebuilt from the checkout, so each commit would otherwise leave one behind.
          docker compose down --rmi local --remove-orphans || true
          sudo E2E_TAP_IFACE="${E2E_TAP_IFACE}" E2E_HOST_IP="${E2E_HOST_IP}" \
            E2E_NETWORK_STATE_DIR="${PWD}/test-output/ubuntu-e2e/network" bash test/e2e_network.sh down
          sudo rm -rf images test-output
